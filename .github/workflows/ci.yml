name: Build

# Every push to main / PR: build + test all archives (attached to the run).
# Manual run with ncnn_ref: build + test that ncnn tag/branch/commit instead of the
# release pinned in ncnn.version. Nothing here publishes; see publish.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ncnn_ref:
        description: 'ncnn tag, branch or commit to build instead of ncnn.version (empty = pinned release)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    uses: ./.github/workflows/build-test.yml
    with:
      ncnn_ref: ${{ inputs.ncnn_ref || '' }}

  # The one check main's ruleset requires, so targets can change without touching the ruleset.
  # always(): a skipped required check counts as passing, so this must run (and fail) when builds fail.
  ci-passed:
    name: CI passed
    if: always()
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.build-test.result }}
